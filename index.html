<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIGHTER SELECT — Portfolio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="select-screen" class="screen active">
  <header class="topbar">
    <h1>⚔ FIGHTER SELECT</h1>
    <p>เลือกผลงาน</p>
  </header>
  <div id="roster" class="roster"></div>
</div>

<div id="detail-screen" class="screen">
  <button id="back-btn" class="back-btn">← Home</button>

  <div class="detail-header">
    <h1>Fighter Details</h1>
  </div>

  <div class="detail-body">
    <aside class="side-panel">
      <button class="side-tab active">Details</button>
      <button class="side-tab">Talent</button>
      <button class="side-tab">Bond</button>
    </aside>

    <div class="fighter-showcase">
      <div class="rank-badge" id="f-rank">SSR</div>
      <div class="stars" id="f-stars">★★★★</div>
      <div class="portrait" id="f-portrait">🥋</div>
      <h2 class="fighter-name" id="f-name">NAME</h2>
      <p class="fighter-level" id="f-tagline">Level:1</p>
    </div>

    <div class="stat-panel">
      <div class="panel-title">+ Fighter attribute</div>
      <div class="attr-grid">
        <div class="attr-card hp">
          <span class="attr-icon">♥</span>
          <div><div class="attr-label">HP</div><div class="attr-value" id="f-hp">0</div></div>
        </div>
        <div class="attr-card atk">
          <span class="attr-icon">👊</span>
          <div><div class="attr-label">Attack</div><div class="attr-value" id="f-atk">0</div></div>
        </div>
        <div class="attr-card def">
          <span class="attr-icon">🛡</span>
          <div><div class="attr-label">Physical Def</div><div class="attr-value" id="f-def">0</div></div>
        </div>
        <div class="attr-card adef">
          <span class="attr-icon">⚡</span>
          <div><div class="attr-label">Attribute Def</div><div class="attr-value" id="f-adef">0</div></div>
        </div>
      </div>

      <div class="skill-line">
        <span class="skill-badge">Skill</span>
        <span id="f-why">—</span>
      </div>

      <div class="panel-title">+ Skills (Tech Stack)</div>
      <div class="skills-row" id="f-skills"></div>

      <div class="panel-title">+ Ultimate (Business Rule)</div>
      <p class="ultimate-text" id="f-ultimate">—</p>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
